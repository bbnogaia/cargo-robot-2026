<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CargoCompany</title>
<style>
  :root {
    --page: #c9dae0;
    --title: #e8920f;
    --btn: #d9579b;
    --btn-hover: #c4448a;
    --log: #8ee0d0;
    --ink: #1d2a30;
    --border: #111;
    --ok: #3b9a57;
    --ko: #b33b3b;
    --idle: #8a979d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: #fff; }

  .page {
    margin: 24px; padding: 24px 32px 32px;
    border: 3px solid var(--border); background: var(--page);
    min-height: calc(100vh - 48px);
  }
  h1 { margin: 0 0 28px; color: var(--title); font-size: 56px; font-weight: 800; letter-spacing: -0.5px; }

  .layout { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(320px, 1fr); gap: 48px; align-items: start; }
  @media (max-width: 980px) { .layout { grid-template-columns: 1fr; } }

  /* --- iframe ambiente virtuale --- */
  .wenv { border: 3px solid var(--border); background: #fff; aspect-ratio: 16 / 9; }
  .wenv iframe { width: 100%; height: 100%; border: 0; display: block; }
  .wenv-caption { margin-top: 8px; font-size: 13px; color: #4b5d64; }

  /* --- colonna destra --- */
  .side { display: flex; flex-direction: column; gap: 20px; }

  .load-btn {
    align-self: flex-start;
    background: var(--btn); color: #fff; border: 0; border-radius: 2px;
    font-size: 17px; font-weight: 700; padding: 16px 34px; cursor: pointer;
    transition: background .15s;
  }
  .load-btn:hover:not(:disabled) { background: var(--btn-hover); }
  .load-btn:disabled { opacity: .55; cursor: not-allowed; }

  .status {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px; border: 3px solid var(--border); font-weight: 700; font-size: 18px; background: #fff;
  }
  .status .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--idle); flex: none; }
  .status.working .dot { background: var(--ok); }
  .status.outofservice { background: #fbe3e3; }
  .status.outofservice .dot { background: var(--ko); animation: blink 1s steps(2, start) infinite; }
  @keyframes blink { to { visibility: hidden; } }

  .log { border: 3px solid var(--border); background: var(--log); height: 320px; overflow-y: auto; padding: 12px 14px; }
  .log h2 { margin: 0 0 8px; font-size: 15px; text-transform: uppercase; letter-spacing: .06em; color: #2a5d55; }
  .log ul { list-style: none; margin: 0; padding: 0; font-size: 14px; line-height: 1.45; }
  .log li { padding: 3px 0; border-bottom: 1px solid rgba(0,0,0,.08); }
  .log li time { font-variant-numeric: tabular-nums; color: #2a5d55; margin-right: 8px; }
  .log li.err { color: #8b1f1f; font-weight: 600; }
  .log li.ok  { color: #155c2e; font-weight: 600; }

  .conn { font-size: 13px; color: #4b5d64; }
  .conn.on::before  { content: "● "; color: var(--ok); }
  .conn.off::before { content: "● "; color: var(--ko); }
</style>
</head>
<body>
<div class="page">
  <h1>CargoCompany</h1>

  <div class="layout">
    <div>
      <div class="wenv"><iframe id="wenv" title="Ambiente virtuale cargorobot"></iframe></div>
      <div class="wenv-caption" id="wenvCaption"></div>
    </div>

    <div class="side">
      <button class="load-btn" id="loadBtn" disabled>Richiesta di carico</button>

      <div class="status" id="status"><span class="dot"></span><span id="statusText">In attesa del server…</span></div>

      <div class="log">
        <h2>Messaggi da webgui</h2>
        <ul id="log"></ul>
      </div>

      <div class="conn off" id="conn">Server non connesso</div>
    </div>
  </div>
</div>

<script>
  // La pagina e' servita da JavalinServer: la WebSocket e' sullo stesso host, endpoint /ws
  const WS_URL = `ws://${location.host}/ws`;
  const WENV   = 'http://localhost:8085';   // ambiente virtuale del cargorobot (iframe)
  const OOS_TIMEOUT_MS = 4500;       // il sonar riemette outOfService ogni 3 s
  const PENDING_TIMEOUT_MS = 60000;  // cargoservice puo' essere occupato con un carico in corso

  const $ = id => document.getElementById(id);
  $('wenv').src = WENV;
  $('wenvCaption').textContent = 'iframe → ' + WENV;

  function log(text, cls) {
    const li = document.createElement('li');
    if (cls) li.className = cls;
    const t = document.createElement('time');
    t.textContent = new Date().toLocaleTimeString('it-IT');
    li.append(t, document.createTextNode(text));
    const ul = $('log');
    ul.appendChild(li);
    while (ul.children.length > 200) ul.removeChild(ul.firstChild);
    ul.parentElement.scrollTop = ul.parentElement.scrollHeight;
  }

  // ---- Service working / Out of service --------------------------------
  // "Out of service" finche' arrivano outOfService; "Service working" quando smettono.
  let oosTimer = null, outOfService = false;
  function setService(oos) {
    $('status').className = 'status ' + (oos ? 'outofservice' : 'working');
    $('statusText').textContent = oos ? 'Out of service' : 'Service working';
    if (oos && !outOfService) log('Out of service: il sonar misura D > DFREE da almeno 3 s', 'err');
    if (!oos && outOfService) log('Service working', 'ok');
    outOfService = oos;
  }
  function onOutOfService() {
    setService(true);
    clearTimeout(oosTimer);
    oosTimer = setTimeout(() => setService(false), OOS_TIMEOUT_MS);
  }

  // ---- Richiesta di carico ---------------------------------------------
  let pending = false, pendingTimer = null;
  function isOpen() { return ws && ws.readyState === WebSocket.OPEN; }
  function setPending(p) {
    pending = p;
    clearTimeout(pendingTimer);
    if (p) pendingTimer = setTimeout(() => {
      setPending(false);
      log('Nessuna risposta da cargoservice dopo 60 s', 'err');
    }, PENDING_TIMEOUT_MS);
    $('loadBtn').disabled = pending || !isOpen();
  }

  // Messaggi da webgui: "loadAccepted(slot2)", "outOfService(ofs)", ...
  function parse(raw) {
    const p = raw.trim().match(/^(\w+)\((.*)\)$/);
    return p ? { name: p[1], args: p[2].split(',').map(a => a.trim()) } : null;
  }

  function onMessage(raw) {
    console.log('Da server:', raw);
    // La risorsa CoAP di webgui potrebbe avere un formato diverso da "outOfService(ofs)":
    // basta che contenga outOfService.
    if (raw.includes('outOfService')) { onOutOfService(); return; }
    const msg = parse(raw);
    if (!msg) return;
    switch (msg.name) {
      case 'loadAccepted':
        log(`loadAccepted: riservato ${msg.args[0]}. Posizionare il container sull'IOPort entro 30 s.`, 'ok');
        setPending(false); break;
      case 'loadRejected':
        log('loadRejected: nessuno slot libero nella stiva.', 'err');
        setPending(false); break;
      case 'loadRetryLater':
        log('loadRetryLater: zona IOPort occupata o sonar fuori servizio, riprovare più tardi.', 'err');
        setPending(false); break;
      case 'outOfService':
        onOutOfService(); break;
    }
  }

  // ---- WebSocket verso webgui (con riconnessione automatica) -----------
  let ws = null;
  function connect() {
    ws = new WebSocket(WS_URL);
    ws.onopen = () => {
      $('conn').className = 'conn on';
      $('conn').textContent = 'Server connesso: ' + WS_URL;
      if (!outOfService) setService(false);
      setPending(pending);
    };
    ws.onmessage = e => onMessage(e.data);
    ws.onclose = () => {
      $('conn').className = 'conn off';
      $('conn').textContent = 'Server non connesso: ' + WS_URL + ' (riprovo…)';
      $('loadBtn').disabled = true;
      setTimeout(connect, 2000);
    };
  }
  connect();

  $('loadBtn').addEventListener('click', () => {
    if (pending || !isOpen()) return;
    ws.send('requestToLoad');
    log('requestToLoad inviata…');
    setPending(true);
  });
</script>
</body>
</html>
